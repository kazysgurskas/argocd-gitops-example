name: gitops-diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/gitops-diff.yaml'

jobs:
  diff:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      # The base of the pull request, and its head merged into the base as
      # GitHub would merge it (the default ref on pull_request events).
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Setup Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: '3.17.0'

      # The app-of-apps chart turns apps/*/app.yaml and infra/*/app.yaml into
      # ArgoCD Application resources; render it in both checkouts.
      - name: Generate ArgoCD Application manifests
        run: |
          for side in base head; do
            mkdir -p "$side/manifests"
            helm template -s templates/application.yaml "$side" > "$side/manifests/applications.yaml"
          done

      - name: Cache Helm charts
        uses: actions/cache@v4
        with:
          path: charts
          key: ${{ github.repository }}/charts-${{ hashFiles('head/manifests/applications.yaml') }}
          restore-keys: |
            ${{ github.repository }}/charts-

      - name: Setup argocd-diff
        uses: kazysgurskas/argocd-diff@v1.0.0

      # Hydrates both checkouts without an ArgoCD instance and diffs the
      # rendered manifests into an HTML report and a Markdown summary.
      - name: Render and diff
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          argocd-diff --base base --head head \
            --applications manifests/applications.yaml \
            --charts-dir charts --rendered rendered \
            --output diff.html --summary diff.md \
            --pr-title "$PR_TITLE" --author "$AUTHOR"

      - name: Upload the report
        id: report
        uses: actions/upload-artifact@v4
        with:
          name: manifest-diff
          path: diff.html

      - name: Compose the comment
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '<!-- manifest-diff-comment -->'
            echo '### Rendered manifest diff'
            echo
            cat diff.md
            echo
            echo "**[Download the full report](${ARTIFACT_URL})** · [workflow run](${RUN_URL})"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find the previous comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '<!-- manifest-diff-comment -->'

      - name: Comment on the pull request
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: comment.md
